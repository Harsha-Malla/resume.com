<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harsha Malla - Resume</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="floating-background"></div>
  <header data-aos="fade-down">
    <h1 id="easter-egg">Harsha Malla</h1>
    <p class="tagline"><span id="typing"></span></p>
    <nav class="navbar">
      <div class="hamburger" onclick="toggleMenu()">☰</div>
      <ul id="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#education">Education</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#achievements">Achievements</a></li>
        <li><a href="#certifications">Certifications</a></li>
        <li><a href="#whyme">Why Me?</a></li>
        <li><a href="#thoughts">Thoughts</a></li>
        <li><a href="#startups">Startups</a></li>
        <li><a href="#stats">Stats</a></li>
        <li><a href="#chatbot">Chatbot</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <!-- ... unchanged main content goes here ... -->

  <footer>
    <p>© 2025 Harsha Malla </p>
  </footer>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();

    // Typing effect for the tagline
    const text = "Startup Enthusiast | IIM Bangalore | Pursuing CA Inter";
    let i = 0;
    function type() {
      if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(type, 50);
      }
    }
    type();

    // Easter egg: Console mode toggle
    document.getElementById("easter-egg").addEventListener("click", () => {
      document.body.classList.toggle("console-mode");
      setTimeout(() => {
        document.body.classList.remove("console-mode");
      }, 8000);
    });

    // Navbar toggle for mobile
    function toggleMenu() {
      const menu = document.getElementById('nav-links');
      menu.classList.toggle('show');
    }
  </script>
</body>

</html>
